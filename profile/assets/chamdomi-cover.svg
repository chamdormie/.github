<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">참도미 — 기숙사 지원 가능 여부와 설명 가능한 룸메이트 매칭</title>
  <desc id="description">A deep green product banner showing the path from a dormitory eligibility check to a matched roommate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081814"/>
      <stop offset="0.56" stop-color="#0f2b24"/>
      <stop offset="1" stop-color="#14473a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe0bb"/>
      <stop offset="1" stop-color="#18a184"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2ecfa8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2ecfa8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1000" cy="80" r="300" fill="url(#glow)"/>
  <path d="M0 344 C205 290 360 402 600 342 C820 285 1010 358 1200 296 L1200 420 L0 420 Z" fill="#05110e" fill-opacity="0.52"/>

  <g font-family="Pretendard, Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="72" y="60" width="392" height="38" rx="19" fill="#2ecfa8" fill-opacity="0.15" stroke="#5fe0bb" stroke-opacity="0.6"/>
    <circle cx="93" cy="79" r="5" fill="#ffe08a"/>
    <text x="108" y="85" fill="#cdf3e7" font-size="15" font-weight="700" letter-spacing="1.05">숭실대 컴퓨터학부 소프트웨어공모전 2026 · 은상</text>

    <text x="70" y="190" fill="#ffffff" font-size="68" font-weight="760" letter-spacing="-2">참</text>
    <text x="142" y="190" fill="url(#accent)" font-size="68" font-weight="760" letter-spacing="-2">도미</text>
    <text x="74" y="241" fill="#cbd8d4" font-size="24" font-weight="520">들어갈 수 있는지, 누구와 살게 되는지.</text>
    <text x="74" y="284" fill="#8ba49d" font-size="17">지원 가능 여부 · 생활 성향 추천 · 근거 공개 · 모집글과 채팅</text>
  </g>

  <g transform="translate(624,116) scale(0.9)" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M78 75 H150 M222 75 H294 M366 75 H438" fill="none" stroke="#5fe0bb" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>

    <g>
      <rect x="4" y="34" width="74" height="82" rx="18" fill="#0f2820" stroke="#5fe0bb" stroke-opacity="0.78"/>
      <path d="M26 92 V66 L41 55 L56 66 V92 Z" fill="none" stroke="#d6f6ec" stroke-width="3" stroke-linejoin="round"/>
      <path d="M35 92 V78 h12 v14" fill="none" stroke="#5fe0bb" stroke-width="3" stroke-linejoin="round"/>
      <text x="41" y="144" fill="#93aaa3" font-size="13" text-anchor="middle">기숙사</text>
    </g>

    <g>
      <rect x="150" y="34" width="72" height="82" rx="18" fill="#123a2f" stroke="#5fe0bb"/>
      <rect x="170" y="56" width="32" height="8" rx="4" fill="#5fe0bb" fill-opacity="0.85"/>
      <rect x="170" y="71" width="24" height="8" rx="4" fill="#d6f6ec" fill-opacity="0.75"/>
      <rect x="170" y="86" width="30" height="8" rx="4" fill="#5fe0bb" fill-opacity="0.5"/>
      <text x="186" y="144" fill="#93aaa3" font-size="13" text-anchor="middle">성향</text>
    </g>

    <g>
      <rect x="294" y="34" width="72" height="82" rx="18" fill="#123a2f" stroke="#5fe0bb"/>
      <circle cx="330" cy="70" r="15" fill="none" stroke="#d6f6ec" stroke-width="3"/>
      <path d="M330 61 v9 l7 5" fill="none" stroke="#5fe0bb" stroke-width="3" stroke-linecap="round"/>
      <path d="M316 96 h28" stroke="#5fe0bb" stroke-width="3" stroke-linecap="round"/>
      <text x="330" y="144" fill="#93aaa3" font-size="13" text-anchor="middle">근거</text>
    </g>

    <g>
      <rect x="438" y="34" width="86" height="82" rx="18" fill="#17513f" stroke="#5fe0bb"/>
      <circle cx="466" cy="68" r="12" fill="#5fe0bb" fill-opacity="0.8"/>
      <circle cx="496" cy="68" r="12" fill="#d6f6ec" fill-opacity="0.72"/>
      <path d="M452 98 c8 -12 20 -12 28 0 M468 98 c8 -12 20 -12 28 0" fill="none" stroke="#bff0e0" stroke-width="3" stroke-linecap="round"/>
      <text x="481" y="144" fill="#93aaa3" font-size="13" text-anchor="middle">룸메이트</text>
    </g>
  </g>
</svg>
